function mbar(label,val,min,max,col){
  const t=max||min,pct=Math.min((val/t)*100,100),over=val>(max||min*1.1),ok=max?val>=min&&val<=max:val>=min*0.9;
  const sc=over?'#c04a3a':ok?'#4a7c59':'#8b6914',bc=over?'#c04a3a':ok?col:'#8b6914';
  return`<div class="mbw"><div class="mbh"><span class="mbl">${label}</span><span class="mbv" style="color:${sc}">${Math.round(val)}${max?` / ${min}–${max}`:` / ${min}`}</span></div><div class="mbt"><div class="mbf" style="width:${pct}%;background:${bc}"></div></div></div>`;
}

function recipeCardHTML(rx){
  const t=sum(rx.ings),op=S.openR.has(rx.id);
  const hasWhey=rx.ings.some(function(ig){return ig.n.toLowerCase().includes('whey')||ig.n.toLowerCase().includes('shake');});
  const hasLiquid=rx.ings.some(function(ig){return ig.u&&ig.u.includes('ml');});
  let h='<div class="rc"><div class="rch" onclick="togR('+rx.id+')">';
  h+='<div><div style="font-weight:700;color:#2c3a2c;font-size:15px">'+esc(rx.name)+'</div>';
  h+='<div style="display:flex;gap:5px;margin-top:4px;flex-wrap:wrap"><span style="font-size:10px;color:#b0b8a8">'+rx.cat+' · '+rx.ings.length+' ingr.</span>';

  if(hasLiquid) h+='<span style="font-size:10px;background:#fdf4e0;color:#8b6914;padding:1px 6px;border-radius:10px;font-weight:600">🥤 Liquide</span>';

  h+='<div style="display:flex;align-items:center;gap:12px"><div style="text-align:right">';
  h+='<div style="font-size:15px;font-weight:800;color:#8b6914">'+Math.round(t.cal)+' kcal</div>';
  h+='<div style="font-size:11px;color:#4a7c59">P: '+Math.round(t.p)+'g</div></div>';
  h+='<span style="color:#b0b8a8;font-size:18px;display:inline-block;transform:'+(op?'rotate(90deg)':'none')+'">›</span></div></div>';
  if(op){
    h+='<div class="rb"><div class="rmc">';
    h+='<div class="rmci"><div class="rmcv" style="color:#4a7c59">'+Math.round(t.p)+'g</div><div class="rmcl">Protéines</div></div>';
    h+='<div class="rmci"><div class="rmcv" style="color:#c67c3a">'+Math.round(t.f)+'g</div><div class="rmcl">Lipides</div></div>';
    h+='<div class="rmci"><div class="rmcv" style="color:#8b6914">'+Math.round(t.c)+'g</div><div class="rmcl">Glucides</div></div>';
    h+='</div>';
    rx.ings.forEach(function(ig){
      var uDisp=ig.u&&ig.u.includes('ml')?'ml':'g';
      h+='<div style="display:flex;justify-content:space-between;padding:7px 10px;background:#fff;border-radius:8px;margin-bottom:5px;font-size:13px;color:#2c3a2c">'+esc(ig.n)+' <span style="color:#b0b8a8">· '+ig.qty+uDisp+'</span><span style="color:#8b6914">'+Math.round(ig.cal*ig.fac)+' kcal</span></div>';
    });
    if(rx.inst) h+='<div style="background:#fff;border-radius:10px;padding:10px 12px;margin-top:8px;margin-bottom:12px"><div style="font-size:11px;color:#b0b8a8;margin-bottom:4px">📋 Instructions</div><div style="font-size:13px;color:#7a8a72;line-height:1.6;white-space:pre-wrap">'+esc(rx.inst)+'</div></div>';
    h+='<div style="display:flex;gap:8px;margin-top:12px">';
    h+='<button class="btn-p" style="flex:2;font-size:13px" onclick="showATR('+rx.id+')">+ Tracker</button>';
    h+='<button class="btn-s" onclick="editR('+rx.id+')">✏️</button>';

function rCourses(){

    const agg={};

      ${ckc>0?`<button class="btn-s" style="font-size:12px;padding:6px 12px" onclick="clrSC()">↺ Tout décocher</button>`:''}

    Object.entries(grp).forEach(([cat,its])=>{
      h+=`<div class="catl">${cat}</div><div class="card" style="margin-bottom:14px">`;
      its.forEach((it,idx)=>{

async function startPhotoAnalysis(){
  const input=document.createElement('input');
  input.type='file';input.accept='image/*';input.capture='environment';
  input.style.display='none';document.body.appendChild(input);
  input.onchange=async function(){
    const file=input.files[0];
    if(!file){document.body.removeChild(input);return;}
    S.photoAnalyzing=true;S.photoError=null;S.photoResult=null;r();
    try{
      // Convert to base64
      const b64=await new Promise(function(res,rej){
        const reader=new FileReader();
        reader.onload=function(){res(reader.result.split(',')[1]);};
        reader.onerror=rej;
        reader.readAsDataURL(file);
      });
      // Call Claude API
      const resp=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          model:'claude-sonnet-4-20250514',
          max_tokens:500,
          messages:[{
            role:'user',
            content:[
              {type:'image',source:{type:'base64',media_type:file.type,data:b64}},
              {type:'text',text:'Tu es un expert en nutrition sportive. Analyse cette photo de repas avec la plus grande précision possible.\n\nMéthode :\n1. Identifie chaque aliment visible séparément\n2. Estime le grammage de chaque aliment en te basant sur des références visuelles (taille de l\'assiette standard = 26cm, bol = 500ml, verre = 25cl, cuillère à soupe = 15g)\n3. Calcule les macros de chaque aliment séparément puis additionne\n4. Sois précis et réaliste — ne surestime pas les portions\n\nRéponds UNIQUEMENT en JSON valide, sans texte avant ou après :\n{"name":"nom court du repas","cal":calories_totales,"p":proteines_g,"f":lipides_g,"c":glucides_g,"details":"liste des aliments estimés avec grammages ex: Riz cuit 200g, Poulet grillé 150g, Huile 10ml","confidence":"faible/moyenne/élevée"}'}
            ]
          }]
        })
      });
      const data=await resp.json();
      const text=data.content.map(function(i){return i.text||'';}).join('');
      const clean=text.replace(/```json|```/g,'').trim();
      const parsed=JSON.parse(clean);
      S.photoResult={
        name:parsed.name||'Repas analysé',
        cal:Math.round(parsed.cal||0),
        p:Math.round(parsed.p||0),
        f:Math.round(parsed.f||0),
        c:Math.round(parsed.c||0),
        details:parsed.details||'',
        confidence:parsed.confidence||'moyenne'
      };
      S.photoAnalyzing=false;r();
    }catch(e){
      S.photoAnalyzing=false;
      S.photoError='Erreur d\'analyse — réessaie avec une photo plus nette 📷';
      r();
    }
    document.body.removeChild(input);
  };
  input.click();
}

async function lookupBarcode(code){
  S.scanError=null;
  try {
    const res = await fetch('https://world.openfoodfacts.org/api/v0/product/'+code+'.json');
    const data = await res.json();
    if(data.status===0||!data.product){
      S.scanError='Produit introuvable dans la base de données 😕';
      S.scanResult=null; r(); return;
    }
    const p = data.product;
    const n100 = p.nutriments;
    const name = p.product_name_fr || p.product_name || p.abbreviated_product_name || 'Produit scanné';
    const cal = Math.round(n100['energy-kcal_100g']||n100['energy-kcal']||0);
    const prot = Math.round((n100.proteins_100g||0)*10)/10;
    const fat = Math.round((n100.fat_100g||0)*10)/10;
    const carb = Math.round((n100.carbohydrates_100g||0)*10)/10;
    if(!cal && !prot && !fat && !carb){
      S.scanError='Infos nutritionnelles manquantes pour ce produit 😕';
      S.scanResult=null; r(); return;
    }
    S.scanResult = {n:name, name, cal, p:prot, f:fat, c:carb, u:'100g'};
    // Save to scanned foods memory if not already there
    if(!S.scannedFoods.some(sf=>sf.n===name)){
      S.scannedFoods.unshift({n:name,cal,p:prot,f:fat,c:carb,u:'100g'});
      if(S.scannedFoods.length>100) S.scannedFoods=S.scannedFoods.slice(0,100); // max 100
      persist();
    }
    S.tsearch=name; r();
  } catch(e) {
    S.scanError='Erreur de connexion — vérifie ton réseau 📶';
    S.scanResult=null; r();
  }
}

function startScan(){
  // Create hidden file input to trigger camera on iPhone
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment'; // rear camera
  input.style.display = 'none';
  document.body.appendChild(input);

  input.onchange = async function(){
    const file = input.files[0];
    if(!file){ document.body.removeChild(input); return; }

    S.scanError = '🔍 Analyse du code-barre…';
    S.scanResult = null; r();

    // Use ZXing via CDN to decode barcode from image
    try {
      const ZXing = await import('https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/esm/index.js');
      const reader = new ZXing.BrowserMultiFormatReader();
      const imgUrl = URL.createObjectURL(file);
      const img = new Image();
      img.onload = async function(){
        try {
          const result = await reader.decodeFromImageElement(img);
          URL.revokeObjectURL(imgUrl);
          S.scanError = null;
          await lookupBarcode(result.getText());
        } catch(e){
          S.scanError = 'Code-barre non reconnu — essaie de mieux cadrer 📷';
          S.scanResult = null; r();
        }
      };
      img.src = imgUrl;
    } catch(e){
      // Fallback: manual barcode entry
      S.scanError = null;
      const code = prompt('Entrez le code-barre du produit (chiffres sous le code) :');
      if(code && code.trim()) await lookupBarcode(code.trim());
      else { S.scanError = null; r(); }
    }
    document.body.removeChild(input);
  };
  input.click();
}

function addFT(){
  const k=dk(S.day);
  let foodData = S.tsfood;

  // Use scan result if available
  if(S.scanResult && !S.tsfood){
    foodData = S.scanResult;
  }
  if(!foodData) return;

  const rawQty=+document.getElementById('tqty')?.value||S.tqty||100;
  const unit=document.getElementById('tunit')?.value||S.tunit||'g';
  const meal=+document.getElementById('tmeal')?.value;
  // Convert quantity to base (always per 100g or 100ml)
  let qtyBase=rawQty;
  if(unit==='cl') qtyBase=rawQty*10;
  else if(unit==='L') qtyBase=rawQty*1000;
  const fac=qtyBase/100;
  if(!S.entries[k])S.entries[k]=[];
  S.entries[k].push({
    id:'e'+Date.now(),
    n:foodData.n||foodData.name,
    cal:foodData.cal,p:foodData.p,f:foodData.f,c:foodData.c,
    fac,qty:qtyBase,
    u:unit==='g'?'100g':'100ml',
    meal
  });
  S.tsfood=null;S.scanResult=null;S.scanError=null;S.tsearch='';S.tqty=100;S.tunit='g';S.tdrop=false;
  persist();r();
}

// ─── INIT ──────────────────────────────────────────────────────────
load(); // load local first for instant display

// Merge default recipes - add any missing ones by id
function mergeDefaultRecipes(){
  const existingIds = new Set(S.recipes.map(r=>r.id));
  const missing = DEFAULT_RECIPES.filter(r=>!existingIds.has(r.id));
  if(missing.length > 0){
    S.recipes = [...S.recipes, ...missing];
    persist();
  }
}

if(!localStorage.getItem('nm_recipes')){
  S.recipes = DEFAULT_RECIPES;
  persist();
} else {
  mergeDefaultRecipes();
}
r(); // render immediately with local data

// Then sync from cloud and re-render
sbLoad().then(()=>{
  mergeDefaultRecipes();
  r();
});

// Show sync indicator
function showSync(){
  const el=document.createElement('div');
  el.innerHTML='☁️ Synchronisé';
  el.style.cssText='position:fixed;bottom:20px;right:16px;background:#2d4a2d;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;font-family:Georgia,serif;z-index:9999;opacity:1;transition:opacity 1s';
  document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),1000);},2000);
}

const _persist = persist;
window.persistAndShow = function(){_persist();showSync();};

const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
if(isIOS&&!window.navigator.standalone&&!localStorage.getItem('nm_b'))
  setTimeout(()=>{document.getElementById('ibanner').style.display='block';},2500);
</script>
